spring:
    datasource:
        url: jdbc:h2:mem:agiliza;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: adm
        password: adm
    jpa:
        hibernate:
            ddl-auto: create-drop
    flyway:
        enabled: false
    h2:
        console:
            enabled: false
            path: /h2-console
            settings:
                web-allow-others: false

spring:
    datasource:
        url: jdbc:h2:mem:agiliza;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: adm
        password: adm
    jpa:
        hibernate:
            ddl-auto: create-drop
    flyway:
        enabled: false
    h2:
        console:
            enabled: false
            path: /h2-console
            settings:
                web-allow-others: false

# Chaves apenas para desenvolvimento local; em producao use as variaveis de ambiente.
agiliza:
    seguranca:
        cpf:
            chave-cifra: ${AGILIZA_CPF_CHAVE_CIFRA:K8asvQ7GEr6geRhYRo3ehKVzQEEgVE1WOFQ1DOSeUJ8=}
            chave-hash: ${AGILIZA_CPF_CHAVE_HASH:Iw/puxmDeVZohf/Q7Ll6GLvqjARxEFwf0JqsU3dyZvI=}

# Perfil PostgreSQL 16 (DVP 1.5.2). O schema vem das migracoes Flyway
# (db/migration); o Hibernate so confere o mapeamento (validate).
# Nenhuma credencial fica no repositorio: tudo vem do ambiente.
spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
            # PROVISORIO (T014): espera por trava de loja de ate 10 s; depois, 409
            connection-init-sql: SET lock_timeout TO '10s'
    jpa:
        hibernate:
            ddl-auto: validate
    flyway:
        enabled: true
        locations: classpath:db/migration

agiliza:
    demo:
        carga-inicial: ${AGILIZA_DEMO:false}

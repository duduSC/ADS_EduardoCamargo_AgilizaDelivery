spring:
  application:
    name: agilizadelivery
  docker:
    compose:
      enabled: false
  profiles:
    active: h2
  jpa:
    open-in-view: false

agiliza:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    routes-url: https://routes.googleapis.com/directions/v2:computeRoutes
    geocoding-url: https://maps.googleapis.com/maps/api/geocode/json
    timeout: 5s
    cache-tamanho: 1000
  seguranca:
    cpf:
      chave-cifra: ${AGILIZA_CPF_CHAVE_CIFRA:}
      chave-hash: ${AGILIZA_CPF_CHAVE_HASH:}
  # JWT (D002). Sem JWT_SECRET a aplicacao nao sobe.
  jwt:
    segredo: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:3h}
    # PROVISORIO: refresh token fora do DVP 3.1.
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
  # Origens do navegador aceitas, separadas por virgula. Vazio: nenhuma.
  cors:
    origens-permitidas: ${CORS_ORIGENS:}
  # Worker de integracao com provedores de pedidos (DVP 1.5.6, T011).
  # Desligado aqui e no perfil postgres; ligado no perfil h2.
  integracao:
    worker:
      habilitado: ${AGILIZA_WORKER:false}
      intervalo: 30s
      # Recuo exponencial do RNF04: recuo-inicial, 2x, 4x... ate max-tentativas.
      recuo-inicial: 200ms
      max-tentativas: 5
    simulador:
      max-por-ciclo: 2
      raio-km: 6
      # Para de gerar quando a loja tiver este numero de entregas aguardando.
      limite-aguardando: 15
  # Carga de demonstracao (D009, T010). SO DESENVOLVIMENTO: desligada aqui
  # e no perfil postgres; ligada no perfil h2. AGILIZA_DEMO=true liga.
  demo:
    carga-inicial: ${AGILIZA_DEMO:false}
    # Senha comum dos usuarios de demonstracao (gravada so como hash BCrypt).
    senha: ${AGILIZA_DEMO_SENHA:agiliza123}

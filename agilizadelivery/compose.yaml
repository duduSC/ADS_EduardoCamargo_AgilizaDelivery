# PostgreSQL 16 para desenvolvimento local (perfil "postgres").
# Os valores vem das mesmas variaveis do perfil: DB_NAME, DB_USER e
# DB_PASSWORD. Os padroes abaixo sao so para a maquina de desenvolvimento,
# nunca para producao. A aplicacao usa DB_URL, por exemplo:
#   DB_URL=jdbc:postgresql://localhost:5432/agiliza
services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=${DB_NAME:-agiliza}'
      - 'POSTGRES_USER=${DB_USER:-agiliza}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-agiliza_dev}'
    ports:
      - '5432:5432'
